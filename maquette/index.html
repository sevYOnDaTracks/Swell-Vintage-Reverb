<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swell Reverb</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --metal-1:#2a2a2b; --metal-2:#202021; --metal-3:#171718;
  --line:#3a3a3b; --line-dark:#0f0f10;
  --cream:#f2f2f2; --cream-dim:#9c9c9c; --muted:#6a6a6a;
  --amber:#ffffff; --amber-dim:#555555;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0e0f;font-family:'Jost',system-ui,sans-serif;color:var(--cream);user-select:none}
.case{display:flex;flex:none;border-radius:10px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7)}
.wood{width:34px;flex:none;position:relative;
  background:
   linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 18%,rgba(255,255,255,.06) 50%,rgba(0,0,0,0) 82%,rgba(0,0,0,.5)),
   repeating-linear-gradient(91deg,rgba(0,0,0,0) 0 3px,rgba(40,18,6,.35) 3px 4px,rgba(0,0,0,0) 4px 9px,rgba(255,200,140,.06) 9px 10px),
   repeating-linear-gradient(88deg,rgba(0,0,0,0) 0 11px,rgba(30,12,4,.28) 11px 13px,rgba(0,0,0,0) 13px 23px),
   linear-gradient(180deg,#7a4524,#5e3219 30%,#6f3d1f 55%,#4f2913 80%,#683820)}
.wood:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 18% at 45% 30%,rgba(30,12,4,.35),transparent 70%),radial-gradient(ellipse 50% 14% at 60% 72%,rgba(30,12,4,.3),transparent 70%)}
.plug{width:1000px;flex:none;overflow:hidden;border-top:1px solid #000;border-bottom:1px solid #000;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,rgba(0,0,0,.025) 1px 3px),
   linear-gradient(180deg,var(--metal-1),var(--metal-2) 60%,var(--metal-3));position:relative}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8d8a85,#3c3a37);box-shadow:0 1px 1px #000}
.screw:after{content:'';position:absolute;left:2px;right:2px;top:4.5px;height:2px;background:#232220;transform:rotate(35deg)}

/* top bar */
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line-dark);box-shadow:0 1px 0 rgba(255,255,255,.04);background:rgba(0,0,0,.18)}
.icons{display:flex;gap:16px;color:var(--cream-dim);width:200px;justify-content:flex-end}
.icons svg{width:18px;height:18px;cursor:pointer}
.icons svg:hover{color:var(--cream)}
.title{text-align:center}
.title h1{margin:0;font-weight:300;font-size:26px;letter-spacing:.42em;color:var(--cream);line-height:1}
.title div{font-size:10px;letter-spacing:.5em;color:var(--cream-dim);margin-top:4px}
.brand{display:flex;align-items:center;gap:9px;width:200px;justify-content:flex-start}
.brand img{height:30px}
.brand .w{font-size:24px;font-weight:400;line-height:1;letter-spacing:.01em}
.brand .a{font-size:8px;letter-spacing:.55em;color:var(--cream-dim);margin-top:2px}

/* main */
.main{display:grid;grid-template-columns:330px 1fr 300px;gap:26px;padding:22px 36px 10px;align-items:start}
.knobs{display:flex;align-items:flex-start;gap:14px}
.k{display:flex;flex-direction:column;align-items:center;cursor:ns-resize}
.k .n{font-size:14px;color:var(--cream);margin-bottom:4px;letter-spacing:.03em}
.k .v{font-size:12px;color:var(--amber);margin-top:2px;font-variant-numeric:tabular-nums}
.k.sm .n{font-size:12px}
.sel{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.box{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:4px;background:#0f0f10;border:1px solid #000;box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05)}
.box span{font-size:15px;color:var(--amber);letter-spacing:.03em;text-shadow:0 0 8px rgba(255,255,255,.35)}
.box b{color:var(--amber);font-weight:400;cursor:pointer;font-size:18px;padding:0 6px;opacity:.8}
.box b:hover{opacity:1}

.meters{padding-top:6px}
.mrow{display:flex;align-items:center;gap:8px;height:20px}
.mrow label{width:58px;text-align:right;font-size:11px;letter-spacing:.12em;color:var(--cream-dim)}
.leds{display:flex;gap:3px}
.led{width:7px;height:9px;border-radius:1.5px;background:#1e1e1f;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.led.on{background:var(--amber);box-shadow:0 0 5px rgba(255,255,255,.7)}
.led.hot.on{background:#ffffff;box-shadow:0 0 5px rgba(255,255,255,.8)}
.scale{display:flex;gap:0;margin-left:66px;font-size:9px;color:var(--muted);height:16px;align-items:center}

.sliders{display:flex;justify-content:center;gap:50px;padding:6px 36px 16px}
.sl{width:250px}
.sl .h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--cream-dim);margin-bottom:7px}
.sl .h em{font-style:normal;color:var(--amber);letter-spacing:.03em}
.track{position:relative;height:4px;background:#0f0f10;border-radius:2px;box-shadow:inset 0 1px 2px #000;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:2px}
.thumb{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#9a9a9a);box-shadow:0 1px 3px #000}

/* tabs */
.tabs{display:flex;justify-content:space-between;align-items:center;padding:0 36px;height:34px;border-top:1px solid var(--line-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);background:rgba(0,0,0,.25)}
.tab{font-size:12px;letter-spacing:.2em;color:var(--muted);cursor:pointer;padding:9px 0;border-bottom:2px solid transparent}
.tab.on{color:var(--amber);border-color:var(--amber)}
.adv{background:rgba(0,0,0,.28);padding:14px 26px 18px;display:flex;gap:10px;min-height:170px}
.grp{border-radius:5px;background:rgba(0,0,0,.18);border:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.04);padding:8px 10px 6px}
.grp .gh{font-size:11px;letter-spacing:.16em;color:var(--cream-dim);text-align:center;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.grp .gk{display:flex;justify-content:space-around;gap:10px}
#eq{display:none;width:100%;height:150px}
</style>
</head>

 hf:v=>(v/1000).toFixed(1)+' kHz', hmul:v=>v.toFixed(2)+'x'};
const R={decay:[.1,20,1],mix:[0,1],gain:[-18,18],pattern:[1,40],pre:[0,250],dtime:[0,500],dlevel:[0,1],rref:[0,1],rrev:[0,1],lf:[50,2000,1],lmul:[.25,4,1],hf:[1000,16000,1],hmul:[.25,4,1]};
const norm=(k,v)=>{const[a,b,l]=R[k];return l?Math.log(v/a)/Math.log(b/a):(v-a)/(b-a)};
const den=(k,t)=>{const[a,b,l]=R[k];return l?a*Math.pow(b/a,t):a+t*(b-a)};
let uid=0;
function knob(parent,key,name,size,small){
 const el=document.createElement('div');el.className='k'+(small?' sm':'');
 el.innerHTML=`<div class="n">${name}</div><svg width="${size+16}" height="${size+16}"></svg><div class="v"></div>`;
 parent.appendChild(el);const svg=el.querySelector('svg'),v=el.querySelector('.v'),id='g'+(uid++);
 const c=(size+16)/2,r=size/2,ar=r+4,bip=key=='gain';
 const P=(a,rr)=>[c+rr*Math.sin(a*Math.PI/180),c-rr*Math.cos(a*Math.PI/180)];
 const arc=(a,b)=>{if(b<a)[a,b]=[b,a];const s=P(a,ar),e=P(b,ar);return`M${s[0]} ${s[1]}A${ar} ${ar} 0 ${b-a>180?1:0} 1 ${e[0]} ${e[1]}`};
 const k={draw(){const t=norm(key,S[key]),ang=-135+t*270,from=bip?0:-135;
  const p1=P(ang,r*.35),p2=P(ang,r-4);
  svg.innerHTML=`<defs><radialGradient id="${id}" cx="40%" cy="28%" r="80%"><stop offset="0" stop-color="#4a4a4b"/><stop offset=".55" stop-color="#212122"/><stop offset="1" stop-color="#0c0c0c"/></radialGradient></defs>
   <path d="${arc(-135,135)}" stroke="#0f0f10" stroke-width="${small?3:4}" fill="none" stroke-linecap="round"/>
   ${Math.abs(ang-from)>.5?`<path d="${arc(from,ang)}" stroke="${AM}" stroke-width="${small?3:4}" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 3px rgba(255,255,255,.6))"/>`:''}
   <circle cx="${c}" cy="${c+2}" r="${r-3}" fill="rgba(0,0,0,.6)"/>
   <circle cx="${c}" cy="${c}" r="${r-3}" fill="url(#${id})" stroke="#050505"/>
   <line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${CR}" stroke-width="${small?2.2:3}" stroke-linecap="round"/>`;
  v.textContent=F[key](S[key])}};
 let y0=null,t0;
 el.addEventListener('pointerdown',e=>{y0=e.clientY;t0=norm(key,S[key]);el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(y0==null)return;S[key]=den(key,Math.max(0,Math.min(1,t0+(y0-e.clientY)/(e.shiftKey?600:180))));k.draw()});
 el.addEventListener('pointerup',()=>y0=null);
 k.draw();return k}

const mk=document.getElementById('mk');
knob(mk,'decay','Decay Time',104);
const col=document.createElement('div');col.style.cssText='display:flex;gap:10px;margin-top:6px';mk.appendChild(col);
knob(col,'mix','Mix',62);knob(col,'gain','Gain',44,true);

const groups=[['REFLECTIONS',[['pattern','Pattern']]],['PRE-DELAY',[['pre','Time']]],['DELAY',[['dtime','Time'],['dlevel','Level']]],['ROLL-OFF',[['rref','Reflections'],['rrev','Reverb']]],['FREQUENCY DEPENDENT DECAY TIME',[['lf','Low Freq'],['lmul','Multiplier'],['hf','High Freq'],['hmul','Multiplier']]]];
const G=document.getElementById('groups');
groups.forEach(([h,ks])=>{const g=document.createElement('div');g.className='grp';g.style.flex=ks.length;g.innerHTML=`<div class="gh">${h}</div><div class="gk"></div>`;G.appendChild(g);ks.forEach(([k,n])=>knob(g.querySelector('.gk'),k,n,48,true))});

const CATS={Halls:['01 Big Hall Vocal','02 Concert Hall','03 Warm Hall'],Rooms:['01 Tight Drum Room','02 Studio Live','03 Wood Room'],Plates:['01 Silver Plate','02 Vocal Plate','03 Snare Plate'],Chambers:['01 Echo Chamber','02 Stone Chamber'],Springs:['01 Dub Spring','02 Surf Spring'],Spaces:['01 Shimmer Pad','02 Infinite Cathedral']};
const cats=Object.keys(CATS);let ci=0,pi=0;
function upd(){document.getElementById('cat').textContent=cats[ci];document.getElementById('pre').textContent=CATS[cats[ci]][pi]}
cp.onclick=()=>{ci=(ci+cats.length-1)%cats.length;pi=0;upd()};cn.onclick=()=>{ci=(ci+1)%cats.length;pi=0;upd()};
pp.onclick=()=>{const l=CATS[cats[ci]].length;pi=(pi+l-1)%l;upd()};pn.onclick=()=>{pi=(pi+1)%CATS[cats[ci]].length;upd()};

const MT=document.getElementById('mt'),NL=20,rows=['INPUT','OUTPUT','EARLY','LATE','VLF'],ledRows=[];
rows.forEach((r,i)=>{if(i==2){const s=document.createElement('div');s.className='scale';['-60','-48','-36','-24','-12','-6','0'].forEach((t,j)=>{const e=document.createElement('span');e.style.width=j<6?'30px':'auto';e.textContent=t;s.appendChild(e)});MT.appendChild(s)}
 const d=document.createElement('div');d.className='mrow';d.innerHTML=`<label>${r}</label><div class="leds"></div>`;const L=d.querySelector('.leds');const arr=[];for(let j=0;j<NL;j++){const e=document.createElement('i');e.className='led'+(j>=NL-2?' hot':'');L.appendChild(e);arr.push(e)}ledRows.push(arr);MT.appendChild(d)});

document.querySelectorAll('.sl').forEach(sl=>{const k=sl.dataset.k,tr=sl.querySelector('.track'),f=sl.querySelector('.fill'),th=sl.querySelector('.thumb'),em=sl.querySelector('em');
 const draw=()=>{f.style.width=th.style.left=(S[k]*100)+'%';em.textContent=k=='vlf'?(-24+S[k]*24).toFixed(1)+' dB':(S[k]<.5?'Early '+Math.round((1-S[k]*2)*100)+'%':S[k]>.98?'Max Late':'Late '+Math.round((S[k]*2-1)*100)+'%')};
 const set=e=>{const r=tr.getBoundingClientRect();S[k]=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));draw()};
 let on=false;tr.onpointerdown=e=>{on=true;tr.setPointerCapture(e.pointerId);set(e)};tr.onpointermove=e=>on&&set(e);tr.onpointerup=()=>on=false;draw()});

const eq=document.getElementById('eq');
function drawEq(){const dp=devicePixelRatio||1,w=eq.clientWidth,h=eq.clientHeight;eq.width=w*dp;eq.height=h*dp;const x=eq.getContext('2d');x.scale(dp,dp);
 const fx=f=>Math.log10(f/20)/3*w,gy=g=>h/2-g*(h/2-10)/15;x.strokeStyle='#2a2a2b';x.lineWidth=1;
 [50,100,200,500,1000,2000,5000,10000].forEach(f=>{x.beginPath();x.moveTo(fx(f),0);x.lineTo(fx(f),h);x.stroke()});
 [-12,-6,0,6,12].forEach(g=>{x.beginPath();x.moveTo(0,gy(g));x.lineTo(w,gy(g));x.stroke()});
 const resp=f=>{let g=0;if(f<120)g-=12*Math.log2(120/f);g+=2.5*Math.exp(-Math.pow(Math.log2(f/250),2)*1.5);g-=3*Math.exp(-Math.pow(Math.log2(f/3000),2)*1.2);if(f>9000)g-=12*Math.log2(f/9000);return g};
 x.beginPath();for(let i=0;i<=w;i++){const y=Math.min(h,gy(resp(20*Math.pow(10,i/w*3))));i?x.lineTo(i,y):x.moveTo(i,y)}
 x.strokeStyle=AM;x.lineWidth=2;x.shadowColor='rgba(255,255,255,.6)';x.shadowBlur=6;x.stroke();x.shadowBlur=0;
 x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fillStyle='rgba(255,255,255,.08)';x.fill();
 [[120,0],[250,2.5],[3000,-3],[9000,0]].forEach(([f,g])=>{x.beginPath();x.arc(fx(f),gy(g),5,0,7);x.fillStyle=CR;x.fill()});
 x.fillStyle='#6a6a6a';x.font='10px Jost';[['100',100],['1k',1000],['10k',10000]].forEach(([l,f])=>x.fillText(l,fx(f)+4,h-6))}
t1.onclick=()=>{t1.classList.add('on');t2.classList.remove('on');G.style.display='flex';eq.style.display='none'};
t2.onclick=()=>{t2.classList.add('on');t1.classList.remove('on');G.style.display='none';eq.style.display='block';drawEq()};

let tm=0,lv=[0,0,0,0,0];
function tick(){tm+=1/60;const beat=(tm%.5)<.03;const inp=beat?.95:lv[0]*.9;
 const dec=Math.pow(10,-3*(1/60)/S.decay);
 lv[0]=inp;lv[1]=Math.max(lv[1]*.93,inp*(.7+S.mix*.3));lv[2]=Math.max(lv[2]*.86,inp*(1-S.el)*.9+.05);lv[3]=Math.max(lv[3]*dec,inp*S.el*.85);lv[4]=Math.max(lv[4]*dec,inp*S.vlf*.7);
 ledRows.forEach((row,i)=>{const n=Math.round(Math.min(1,lv[i]+Math.random()*.03)*NL);row.forEach((e,j)=>e.classList.toggle('on',j<n))});
 requestAnimationFrame(tick)}
tick();
function fitPlug(){document.querySelector('.case').style.zoom=Math.min(1,(innerWidth-24)/1068)}
fitPlug();addEventListener('resize',fitPlug);
</script>
</body>
</html>
